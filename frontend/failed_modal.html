    <!-- Modal de Lista de Falhas -->
    <div x-show="showFailedModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" x-cloak>
        <div class="bg-white dark:bg-bgSurfaceHover p-6 rounded-xl max-w-2xl w-full shadow-lg relative flex flex-col max-h-[80vh]">
            <button @click="showFailedModal = false" class="absolute top-4 right-4 text-textMuted hover:text-red-500">&times;</button>
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                Mensagens com Falha
            </h2>

            <div class="flex-1 overflow-y-auto mb-4 border dark:border-borderSubtle rounded p-2">
                <template x-if="failedMessages.length === 0 && !failedLoading">
                    <div class="text-center text-textMuted p-8">Nenhuma falha encontrada para este trajeto.</div>
                </template>
                <template x-if="failedLoading">
                    <div class="text-center text-textMuted p-8">Carregando...</div>
                </template>
                <div class="space-y-2">
                    <template x-for="fail in failedMessages" :key="fail.id">
                        <div class="bg-red-50 dark:bg-red-900/10 p-3 rounded border border-red-100 dark:border-red-900/30 text-sm">
                            <div class="flex justify-between items-start mb-1">
                                <span class="font-bold text-red-600 dark:text-red-400" x-text="'Mensagem ID: ' + fail.message_id"></span>
                                <span class="text-xs bg-red-200 dark:bg-red-800 text-red-800 dark:text-red-200 px-2 rounded-full" x-text="fail.status"></span>
                            </div>
                            <div class="text-gray-600 dark:text-textSec" x-text="fail.error_message || 'Erro desconhecido'"></div>
                            <div class="text-xs text-textMuted mt-1" x-text="'Tentativas: ' + fail.retry_count + '/' + fail.max_retries"></div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="flex justify-end gap-2">
                <button @click="showFailedModal = false" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded font-bold hover:bg-gray-300 dark:hover:bg-gray-600 transition">Fechar</button>
                <button @click="retryFailed(); showFailedModal = false" class="px-4 py-2 bg-red-600 text-textMain rounded font-bold hover:bg-red-700 transition" :disabled="failedMessages.length === 0">Tentar Novamente Todas</button>
            </div>
        </div>
    </div>
